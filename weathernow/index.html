<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Weather Now</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body { 
    width: 100%; height: 100%; background: #fff; 
    font-family: Georgia, serif; overflow: hidden;
  }

  /* Shared Text Styles */
  .loc { font-weight: bold; line-height: 1.1; }
  .v-time { font-size: 14px; font-weight: bold; }
  .v-temp { font-size: 18px; margin: 1px 0; }
  .v-cond { font-size: 10px; line-height: 1.1; } 
  .v-data { font-size: 10px; }

  /* --- Desktop (840x480) --- */
  @media screen and (min-width: 841px) {
    .container {
      width: 840px; height: 480px; margin: auto;
      padding: 30px 100px 30px 35px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .top-row { display: flex; justify-content: space-between; align-items: flex-start; }
    .col-left { width: 230px; }
    .col-center { flex: 1; text-align: center; }
    .col-right { width: 210px; text-align: right; }
    .loc { font-size: 28px; }
    .sub-loc { font-size: 18px; margin-top: 2px; }
    .date-line { font-size: 12px; margin-top: 6px; display: block; }
    .sun { font-size: 12px; margin-top: 8px; border-top: 1px solid #000; display: inline-block; padding-top: 4px; }
    .temp-big { font-size: 115px; line-height: .8; }
    .cond-big { font-size: 25px; margin-top: 5px; }
    .details { font-size: 17px; line-height: 1.6; }
    .flourish-swoosh { height: 22px; margin: 12px 0 6px auto; display: block; width: 60px; }
    .quote { font-size: 15px; line-height: 1.25; }
    .hourly-row { 
      display: grid; grid-template-columns: repeat(5, 70px) 1fr; column-gap: 20px; 
      border-top: 3px solid #000; border-bottom: 3px solid #000; padding: 15px 0;
    }
    .info-block, .footer { font-size: 18px; line-height: 1.3; }
  }

  /* --- Mobile/Portrait (Vertical Stack) --- */
  @media screen and (max-width: 840px) {
    .container {
      width: 100vw; height: 100vh;
      display: flex; flex-direction: column;
      padding: 10px; text-align: center;
    }
    .loc { font-size: 20px; }
    .sub-loc { font-size: 14px; }
    .date-line { font-size: 11px; margin-bottom: 2px; }
    .sun { font-size: 11px; border-top: 1px solid #000; padding-top: 2px; margin-bottom: 5px; }
    
    .temp-big { font-size: 80px; line-height: 1; margin: 0; }
    .cond-big { font-size: 18px; margin-bottom: 2px; }
    .details-mobile { font-size: 14px; margin-bottom: 8px; }

    .hourly-row {
      display: grid; grid-template-columns: 1fr 1fr;
      border-top: 2px solid #000; border-bottom: 2px solid #000;
      padding: 5px 0; margin-bottom: 5px; flex-grow: 1;
    }
    .h-col { border-bottom: 1px solid #eee; padding: 4px 0; display: flex; flex-direction: column; justify-content: center; }
    .h-col:nth-child(odd) { border-right: 1px solid #000; }
    .h-col:nth-last-child(-n+2) { border-bottom: none; }

    .info-block, .footer { font-size: 13px; line-height: 1.2; text-align: left; padding: 2px 0; }
    .flourish-swoosh, .quote, .sun-desktop { display: none !important; }
  }
</style>
</head>
<body>

<div id="dashboard" class="container">
  <div style="text-align:center; padding-top:100px;">Loading...</div>
</div>

<script>
async function fetchWeather() {
  const lat = 56.60712432274488;
  const lon = -3.0858753489219812;
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m,wind_gusts_10m&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max,weather_code,wind_speed_10m_max,wind_gusts_10m_max&timezone=Europe%2FLondon&forecast_days=3&wind_speed_unit=mph`;

  try {
    const response = await fetch(url);
    const data = await response.json();
    renderDashboard(data);
  } catch (error) {
    document.getElementById('dashboard').innerHTML = "Connection Error";
  }
}

function formatAmPm(hour) {
  if (hour === 0) return "12am";
  if (hour < 12) return hour + "am";
  if (hour === 12) return "12pm";
  return (hour - 12) + "pm";
}

function getCondString(code, isNight, wind, prob, format) {
  if (format === 'hourly') {
    if (code >= 95) return "Thunder";
    if (prob >= 40) return (code >= 71 && code <= 86) ? "Snow" : "Showers";
    if (code === 0) return isNight ? "Clear" : "Sunny";
    if (code === 3) return "Cloudy";
    if (code >= 51 && code <= 67) return "Rain";
    return "Cloudy";
  }
  return (code >= 95) ? "Thunder" : (prob >= 40) ? "Rainy" : (code <= 1) ? "Clear" : "Cloudy";
}

function renderDashboard(data) {
  const d = data;
  const now = new Date();
  const ukTime = new Date(now.toLocaleString("en-US", {timeZone: "Europe/London"}));
  const hr_now = d.hourly.time.indexOf(ukTime.toISOString().split(':')[0] + ':00');
  const day_now = 0;

  const cur_p = d.hourly.precipitation_probability[hr_now];
  const cur_c = d.hourly.weather_code[hr_now];
  const cur_t = Math.round(d.hourly.temperature_2m[hr_now]);
  
  const isNight = ukTime.getHours() >= 21 || ukTime.getHours() < 6;
  const dateString = ukTime.toLocaleDateString('en-GB', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

  // Hourly + Later logic (Preserved)
  let hourlyHTML = "";
  for (let i = 1; i <= 5; i++) {
    const idx = hr_now + i;
    const hi = parseInt(d.hourly.time[idx].split("T")[1]);
    hourlyHTML += `
      <div class="h-col">
        <div class="v-time">${formatAmPm(hi)}</div>
        <div class="v-temp">${Math.round(d.hourly.temperature_2m[idx])}°</div>
        <div class="v-cond">${getCondString(d.hourly.weather_code[idx], false, 0, d.hourly.precipitation_probability[idx], 'hourly')}</div>
        <div class="v-data">Rain: ${d.hourly.precipitation_probability[idx]}%</div>
        <div class="v-data">${Math.round(d.hourly.wind_speed_10m[idx])}/${Math.round(d.hourly.wind_gusts_10m[idx])}mph</div>
      </div>`;
  }

  const isMobile = window.innerWidth <= 840;
  const swooshHTML = isMobile ? "" : `<svg class="flourish-swoosh" viewBox="0 0 100 30" preserveAspectRatio="none"><path d="M0,15 C20,35 40,-5 60,15 C80,35 100,-5 120,15" stroke="black" stroke-width="3.5" fill="none"/></svg><div class="quote">‘Inspiration is the<br>Temple of Quest’</div>`;

  document.getElementById('dashboard').innerHTML = `
    <div class="top-row">
      <div class="loc">Weather now</div>
      <div class="sub-loc">Castleton of Eassie</div>
      <div class="date-line">${dateString}</div>
      <div class="sun">Sunrise 5.16am ☀ Sunset 9.01pm</div>
    </div>
    
    <div class="col-center">
      <div class="temp-big">${cur_t}°</div>
      <div class="cond-big">${getCondString(cur_c, isNight, 0, cur_p, 'big')}</div>
      <div class="details-mobile">Rain: ${cur_p}% &nbsp; Wind: ${Math.round(d.hourly.wind_speed_10m[hr_now])}/${Math.round(d.hourly.wind_gusts_10m[hr_now])}mph</div>
    </div>

    <div class="hourly-row">
      ${hourlyHTML}
      <div class="h-col">
        <div class="v-time">Later</div>
        <div class="v-temp">${Math.round(d.daily.temperature_2m_max[0])}°</div>
        <div class="v-cond">Likely dry</div>
      </div>
    </div>

    <div class="info-block"><b>Overnight:</b> Likely clear. Lows of 4°. Winds 8/16mph.</div>
    <div class="footer"><b>Tomorrow:</b> Sunny. Highs of 14°, lows of 6°. Winds 10/20mph.</div>
  `;
}
fetchWeather();
</script>
</body>
</html>
