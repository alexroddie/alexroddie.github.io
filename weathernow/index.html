<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Weather Now</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body { 
    width: 100%; height: 100%; background: #fff; 
    font-family: Georgia, serif; 
    display: flex; justify-content: center; align-items: flex-start;
  }

  .container { background: #fff; color: #000; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; }
  .loc { font-weight: bold; line-height: 1; }

  /* --- DESKTOP (840x480) - FIXED CANVAS --- */
  @media screen and (min-width: 841px) {
    body { align-items: center; overflow: hidden; }
    .container {
      width: 840px; height: 480px;
      padding: 30px 100px 30px 35px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .top-row { display: flex; justify-content: space-between; align-items: flex-start; }
    .main-stats { display: contents; } 
    .col-left { width: 230px; }
    .col-center { flex: 1; text-align: center; }
    .col-right { width: 210px; text-align: right; }
    .loc { font-size: 28px; }
    .sub-loc { font-size: 20px; margin-top: 4px; }
    .date-line { font-size: 15px; margin-top: 8px; display: block; }
    .sun { font-size: 14px; margin-top: 10px; border-top: 1px solid #000; display: inline-block; padding-top: 4px; white-space: nowrap; }
    .temp-big { font-size: 115px; line-height: .8; }
    .cond-big { font-size: 28px; margin-top: 8px; }
    .details { font-size: 20px; line-height: 1.5; }
    .details div { font-size: 20px !important; }
    .flourish-swoosh { height: 22px; margin: 12px 0 6px auto; display: block; width: 60px; }
    .quote { font-size: 16px; line-height: 1.3; }
    .hourly-row { 
      display: grid; grid-template-columns: repeat(5, 70px) 1fr; column-gap: 25px; 
      border-top: 3px solid #000; border-bottom: 3px solid #000; padding: 18px 0; margin: 8px 0;
    }
    .v-time { font-size: 18px; font-weight: bold; }
    .v-temp { font-size: 24px; margin: 4px 0; }
    .v-cond, .v-data, .later-text { font-size: 13px; line-height: 16px; }
    .later-col { text-align: left; padding-left: 15px; }
    .info-block, .footer { font-size: 20px; line-height: 1.4; }
  }

  /* --- RESPONSIVE / MOBILE / KINDLE --- */
  @media screen and (max-width: 840px) {
    body { overflow-y: auto; }
    .container { width: 100vw; min-height: 100vh; padding: 25px 15px; text-align: center; display: block; }
    .loc { font-size: 26px; }
    .sub-loc { font-size: 20px; margin-top: 4px; }
    .date-line { font-size: 16px; margin: 6px 0; }
    .sun { font-size: 15px; display: block; margin-top: 8px; }
    
    /* Widened Gap specifically for Kindle/E-Ink spacing */
    .main-stats { 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      gap: 100px; /* Increased from 80px for Kindle */
      margin: 15px 0 25px; 
    }
    .col-center { text-align: right; flex: 0 0 auto; min-width: 100px; }
    .col-right { text-align: right; flex: 0 0 auto; min-width: 100px; } 
    
    .temp-big { font-size: 80px; line-height: 0.9; }
    .cond-big { font-size: 20px; margin-top: -2px; }
    .details { font-size: 18px; line-height: 1.5; }
    .details div { font-size: 18px !important; }
    
    .flourish-swoosh, .quote { display: none !important; }

    .hourly-row { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      border-top: 3px solid #000; 
      border-bottom: 3px solid #000; 
      padding: 12px 0; 
      margin: 20px 0; 
      column-gap: 10px;
    }
    .h-col, .later-col { padding: 12px 0; display: flex; flex-direction: column; align-items: center; }
    .v-time { font-size: 18px; font-weight: bold; }
    .v-temp { font-size: 24px; margin: 4px 0; }
    .v-cond { font-size: 13px; line-height: 1.2; height: 2.8em; display: flex; align-items: center; justify-content: center; margin-bottom: 6px; }
    .v-data { font-size: 13px; line-height: 1.4; }
    
    .info-block, .footer { font-size: 18px; line-height: 1.5; text-align: left; padding: 10px 0; }
  }
</style>
</head>
<body>
<div id="dashboard" class="container">
  <div style="text-align:center; padding-top:100px;">Syncing...</div>
</div>

<script>
async function fetchWeather() {
  const lat = 56.60712432274488;
  const lon = -3.0858753489219812;
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m,wind_gusts_10m&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max,weather_code,wind_speed_10m_max,wind_gusts_10m_max&timezone=Europe%2FLondon&forecast_days=3&wind_speed_unit=mph`;
  try {
    const response = await fetch(url);
    const data = await response.json();
    renderDashboard(data);
  } catch (error) {
    document.getElementById('dashboard').innerHTML = "Sync Error";
  }
}

function getOrdinalNum(n) {
  const s = ["th", "st", "nd", "rd"];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function formatAmPm(hour) {
  if (hour === 0) return "12am";
  if (hour < 12) return hour + "am";
  if (hour === 12) return "12pm";
  return (hour - 12) + "pm";
}

function formatSunTime(isoStr) {
  const time = isoStr.split("T")[1];
  let [h, m] = time.split(":");
  h = parseInt(h);
  const ampm = h >= 12 ? 'pm' : 'am';
  h = h % 12 || 12;
  return `${h}.${m}${ampm}`;
}

function getCondString(code, isNight, wind, prob, format) {
  if (format === 'hourly') {
    if (code >= 95) return "Thunder";
    if (prob >= 40) return (code >= 71 && code <= 86) ? "Snow" : "Showers";
    if (code === 0) return isNight ? "Clear" : "Sunny";
    if (code === 1) return isNight ? "Mostly clear" : "Mostly sunny";
    if (code === 2) return "Partly cloudy";
    if (code === 3) return "Cloudy";
    if (code >= 71 && code <= 86) return "Snow";
    if (code >= 61 && code <= 67) return "Rain";
    if (code >= 80 && code <= 82) return "Showers";
    if (code >= 51 && code <= 57) return "Drizzle";
    if (wind > 20) return "Windy";
    if (code === 45 || code === 48) return "Fog";
    return "Cloudy";
  } else if (format === 'summary') {
    if (code >= 95) return "Thunder. ";
    if (prob >= 40) return (code >= 71 && code <= 86) ? "Snowy. " : "Rainy. ";
    if (code === 0) return isNight ? "Clear sky. " : "Sunny. ";
    if (code === 1) return isNight ? "Mostly clear. " : "Mostly sunny. ";
    if (code === 2) return "Partly cloudy. ";
    if (code === 45 || code === 48) return "Foggy. ";
    return "Cloudy. ";
  } else {
    if (code >= 95) return "Thunder";
    if (prob >= 40) return (code >= 71 && code <= 86) ? "Snow" : "Rain";
    if (code === 0) return isNight ? "Clear sky" : "Sunny";
    if (code === 1) return isNight ? "Mostly clear" : "Mostly sunny";
    if (code === 2) return "Partly cloudy";
    if (code === 3) return "Cloudy";
    if (code >= 71 && code <= 86) return "Snow";
    if (code >= 61 && code <= 67) return "Rain";
    if (code >= 80 && code <= 82) return "Showers";
    if (code >= 51 && code <= 57) return "Drizzle";
    if (wind > 20) return "Windy";
    return "Cloudy";
  }
}

function renderDashboard(data) {
  const d = data;
  const now = new Date();
  const ukTime = new Date(now.toLocaleString("en-US", {timeZone: "Europe/London"}));
  const cur_h = ukTime.getHours();
  const day_now = 0;
  const targetHour = `${ukTime.getFullYear()}-${String(ukTime.getMonth() + 1).padStart(2, '0')}-${String(ukTime.getDate()).padStart(2, '0')}T${String(cur_h).padStart(2, '0')}:00`;
  let hr_now = d.hourly.time.indexOf(targetHour);
  if (hr_now === -1) hr_now = cur_h; 

  const endOfDayIdx = hr_now + (23 - cur_h); 
  const sunset_hr = parseInt(d.daily.sunset[day_now].split("T")[1].split(":")[0]);
  const sunrise_hr = parseInt(d.daily.sunrise[day_now].split("T")[1].split(":")[0]);
  const isNight = cur_h >= sunset_hr || cur_h < sunrise_hr;
  const dateString = `${["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"][ukTime.getDay()]}, ${["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"][ukTime.getMonth()]} ${getOrdinalNum(ukTime.getDate())}, ${ukTime.getFullYear()}`;

  let hourlyHTML = "";
  for (let i = 1; i <= 5; i++) {
    const idx = hr_now + i;
    const hi = parseInt(d.hourly.time[idx].split("T")[1].split(":")[0]);
    hourlyHTML += `<div class="h-col"><div class="v-time">${formatAmPm(hi)}</div><div class="v-temp">${Math.round(d.hourly.temperature_2m[idx])}°</div><div class="v-cond">${getCondString(d.hourly.weather_code[idx], hi >= sunset_hr || hi < sunrise_hr, d.hourly.wind_speed_10m[idx], d.hourly.precipitation_probability[idx], 'hourly')}</div><div class="v-data">Rain: ${d.hourly.precipitation_probability[idx]}%</div><div class="v-data">${Math.round(d.hourly.wind_speed_10m[idx])}/${Math.round(d.hourly.wind_gusts_10m[idx])}mph</div></div>`;
  }

  const scanStart = hr_now + 6;
  let fMax = -99; for (let k = scanStart; k <= endOfDayIdx; k++) { if (d.hourly.temperature_2m[k] > fMax) fMax = d.hourly.temperature_2m[k]; }
  let uLow = 99; for (let k = scanStart; k <= hr_now + 18; k++) { if (d.hourly.temperature_2m[k] < uLow) uLow = d.hourly.temperature_2m[k]; }
  const tempDisplay = (Math.round(fMax) >= Math.round(d.daily.temperature_2m_max[day_now])) ? `${Math.round(d.daily.temperature_2m_max[day_now])}°/${Math.round(uLow)}°` : `${Math.round(uLow)}°`;
  let lmp = 0, lc = 99, lwm = 0, lgm = 0, lphRes = -1, lphCode = 0;
  for (let j = scanStart; j <= endOfDayIdx; j++) {
    let p = d.hourly.precipitation_probability[j]; if (p > lmp) lmp = p;
    if (p >= 40 && lphRes === -1) { lphRes = parseInt(d.hourly.time[j].split("T")[1].split(":")[0]); lphCode = d.hourly.weather_code[j]; }
    if (d.hourly.weather_code[j] < lc) lc = d.hourly.weather_code[j];
    if (d.hourly.wind_speed_10m[j] > lwm) lwm = d.hourly.wind_speed_10m[j];
    if (d.hourly.wind_gusts_10m[j] > lgm) lgm = d.hourly.wind_gusts_10m[j];
  }

  let laterHTML = "";
  if (window.innerWidth > 840) {
    let laterSum = getCondString(lc, true, lwm, lmp, 'summary');
    laterSum += (lphRes !== -1) ? `${(lphCode >= 71 && lphCode <= 86) ? "Snow" : "Rain"} at ${formatAmPm(lphRes)}. ` : `Likely dry. `;
    laterSum += lgm < 10 ? `Probably calm.` : `Winds ${Math.round(lwm)}/${Math.round(lgm)}mph.`;
    laterHTML = `<div class="later-col"><div class="v-time">Later</div><div class="v-temp">${tempDisplay}</div><div class="later-text">${laterSum}</div></div>`;
  } else {
    laterHTML = `<div class="later-col"><div class="v-time">Later</div><div class="v-temp">${tempDisplay}</div><div class="v-cond">${getCondString(lc, true, lwm, lmp, 'hourly')}</div><div class="v-data">${(lphRes !== -1) ? (lphCode >= 71 && lphCode <= 86 ? 'Snow' : 'Rain') + ' at ' + formatAmPm(lphRes) : 'Likely dry'}</div><div class="v-data">${Math.round(lwm)}/${Math.round(lgm)}mph</div></div>`;
  }

  let nLow = 100, nWi = 0, nGu = 0, nMp = 0, nPhRes = -1, nPhCode = 0;
  for (let j = endOfDayIdx - 1; j <= endOfDayIdx + 7; j++) { if (j >= hr_now && j < d.hourly.time.length) { if (d.hourly.temperature_2m[j] < nLow) nLow = d.hourly.temperature_2m[j]; if (d.hourly.wind_speed_10m[j] > nWi) nWi = d.hourly.wind_speed_10m[j]; if (d.hourly.wind_gusts_10m[j] > nGu) nGu = d.hourly.wind_gusts_10m[j]; let p = d.hourly.precipitation_probability[j]; if (p > nMp) nMp = p; if (p >= 40 && nPhRes === -1) { nPhRes = parseInt(d.hourly.time[j].split("T")[1].split(":")[0]); nPhCode = d.hourly.weather_code[j]; } } }
  let overHTML = `Likely ${nMp >= 40 ? (nPhCode >= 71 && nPhCode <= 86 ? "snowy" : "rainy") : (d.hourly.weather_code[endOfDayIdx + 1] === 0 ? "clear" : "cloudy")}. Lows of ${Math.round(nLow)}°. ${nPhRes !== -1 ? (nPhCode >= 71 && nPhCode <= 86 ? "Snow" : "Rain") + " at " + formatAmPm(nPhRes) + ". " : "Likely dry. "}${nGu < 10 ? "Probably calm." : "Winds " + Math.round(nWi) + "/" + Math.round(nGu) + "mph."}`;
  let tomIdx = day_now + 1, tomPhRes = -1, daylightRainCount = 0, tomPhCode = 0;
  for (let j = endOfDayIdx + 7; j <= endOfDayIdx + 24; j++) { if (j < d.hourly.time.length) { let p = d.hourly.precipitation_probability[j]; if (p >= 40 && tomPhRes === -1) { tomPhRes = parseInt(d.hourly.time[j].split("T")[1].split(":")[0]); tomPhCode = d.hourly.weather_code[j]; } if (j <= endOfDayIdx + 19 && p >= 40) daylightRainCount++; } }
  let tomStr = `${daylightRainCount >= 3 ? "Rainy." : (d.daily.weather_code[tomIdx] === 0 ? "Sunny." : "Cloudy.")} Highs of ${Math.round(d.daily.temperature_2m_max[tomIdx])}°, lows of ${Math.round(d.daily.temperature_2m_min[tomIdx])}°. ${tomPhRes !== -1 ? "Expect " + (tomPhCode >= 71 && tomPhCode <= 86 ? "snow" : "rain") + " at about " + formatAmPm(tomPhRes) + ". " : "Likely dry. "}Winds ${Math.round(d.daily.wind_speed_10m_max[tomIdx])}/${Math.round(d.daily.wind_gusts_10m_max[tomIdx])}mph.`;

  document.getElementById('dashboard').innerHTML = `
    <div class="top-row">
      <div class="col-left"><div class="loc">Weather now</div><div class="sub-loc">Castleton of Eassie</div><div class="date-line">${dateString}</div><div class="sun">Sunrise ${formatSunTime(d.daily.sunrise[day_now])} &#9728;&#xFE0E; Sunset ${formatSunTime(d.daily.sunset[day_now])}</div></div>
      <div class="main-stats">
        <div class="col-center"><div class="temp-big">${Math.round(d.hourly.temperature_2m[hr_now])}°</div><div class="cond-big">${getCondString(cur_c, isNight, cur_w, cur_p, 'big')}</div></div>
        <div class="col-right"><div class="details"><div>Rain: ${d.hourly.precipitation_probability[hr_now]}%</div><div>Wind: ${Math.round(d.hourly.wind_speed_10m[hr_now])}/${Math.round(d.hourly.wind_gusts_10m[hr_now])}mph</div><svg class="flourish-swoosh" viewBox="0 0 100 30" preserveAspectRatio="none"><path d="M0,15 C20,35 40,-5 60,15 C80,35 100,-5 120,15" stroke="black" stroke-width="3.5" fill="none"/></svg><div class="quote">‘Inspiration is the<br>Temple of Quest’</div></div></div>
      </div>
    </div>
    <div class="hourly-row">${hourlyHTML}${laterHTML}</div>
    <div class="info-block"><b>Overnight:</b> ${overHTML}</div><div class="footer"><b>Tomorrow:</b> ${tomStr}</div>`;
}
fetchWeather();
</script>
</body>
</html>
