<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maps</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* 1. Global Reset & Georgia Enforcement */
        * { 
            -webkit-tap-highlight-color: transparent !important; 
            box-sizing: border-box !important; 
            margin: 0; padding: 0;
            font-family: Georgia, serif !important;
        }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden; position: fixed; 
            background-color: #ffffff;
        }

        #map { 
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; 
            width: 100%; height: 100%; 
            background: #ffffff; z-index: 1; 
        }

        /* 2. Unified Shadow Panel (5px Border / 4px Shadow) */
        .shadow-panel { 
            background: #ffffff; 
            border: 2px solid #000000; 
            z-index: 1000; 
            box-shadow: 4px 4px 0 #000000; 
            position: fixed; /* Bypasses Kindle rendering shifts */
            padding: 5px; 
        }

        /* 3. Search Cluster Geometry */
        .panel-top-left { top: 15px; left: 15px; width: 260px; }
        
        #search-input { 
            width: 250px; height: 36px; padding: 0 8px; 
            font-size: 16px; border: 2px solid black; 
            margin-bottom: 10px; display: block; background: #fff;
        }
        
        .search-table { width: 250px; border-collapse: collapse; table-layout: fixed; }
        .search-table td { padding: 0; vertical-align: top; }
        
        /* SEARCH & X Buttons: Identical font size and weight */
        .sys-btn { 
            background: #ffffff; border: 2px solid black;
            font-weight: bold; cursor: pointer; text-transform: uppercase; 
            height: 36px; line-height: 32px; text-align: center; width: 100%;
            display: block; font-size: 16px;
        }
        .sys-btn:active { background: #000000; color: #ffffff !important; }

        /* 4. Navigation Cluster (The "Vanishing" Fix) */
        .nav-wrapper { 
            position: fixed; 
            bottom: 40px; /* Higher clearance for Kindle UI */
            right: 15px; 
            z-index: 1000;
            width: 135px;
            text-align: center;
        }

        /* Zoom Cluster (5px Padding) */
        .zoom-panel { 
            display: inline-block; width: 45px; margin-bottom: 15px; 
        }
        .zoom-sep { height: 10px; }

        /* Panning Cluster (5px Padding) */
        .dpad-panel { display: inline-block; width: 135px; }
        .dpad-table { border-collapse: separate; border-spacing: 10px; margin: -10px; }
        
        /* Navigation Buttons */
        .ctrl-btn { 
            width: 35px; height: 35px; cursor: pointer; background: #fff;
            border: 2px solid black; display: block; position: relative;
        }
        .ctrl-btn svg { 
            display: block; width: 24px; height: 24px; 
            position: absolute; top: 50%; left: 50%; 
            margin: -12px 0 0 -12px; fill: black;
        }
        .ctrl-btn:active { background: #000000; }
        .ctrl-btn:active svg { fill: #ffffff; }

    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Search Cluster -->
    <div class="shadow-panel panel-top-left">
        <input type="text" id="search-input" placeholder="Search..." onkeypress="if(event.keyCode==13)searchLocation()">
        <table class="search-table">
            <tr>
                <td style="width: 180px;">
                    <button class="sys-btn" id="search-button" onclick="searchLocation()">SEARCH</button>
                </td>
                <td style="width: 10px;"></td> <!-- Strict 10px Internal Gap -->
                <td style="width: 60px;">
                    <button class="sys-btn" onclick="clearSearch()">X</button>
                </td>
            </tr>
        </table>
    </div>

    <!-- Navigation Clusters Container -->
    <div class="nav-wrapper">
        <!-- Separate Zoom Panel Centered Above -->
        <div class="shadow-panel zoom-panel" style="position: relative; left: auto; bottom: auto; right: auto; margin-bottom: 15px;">
            <button class="ctrl-btn" onclick="map.zoomIn()"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>
            <div class="zoom-sep"></div>
            <button class="ctrl-btn" onclick="map.zoomOut()"><svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg></button>
        </div>

        <!-- Separate Panning Panel -->
        <div class="shadow-panel dpad-panel" style="position: relative; left: auto; bottom: auto; right: auto;">
            <table class="dpad-table">
                <tr>
                    <td></td>
                    <td><button class="ctrl-btn" onclick="panMap(0, -1)"><svg viewBox="0 0 24 24"><path d="M12 8l-6 6h12l-6-6z"/></svg></button></td>
                    <td></td>
                </tr>
                <tr>
                    <td><button class="ctrl-btn" onclick="panMap(-1, 0)"><svg viewBox="0 0 24 24"><path d="M16 6l-6 6 6 6V6z"/></svg></button></td>
                    <td><button class="ctrl-btn" onclick="resetView()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></svg></button></td>
                    <td><button class="ctrl-btn" onclick="panMap(1, 0)"><svg viewBox="0 0 24 24"><path d="M8 6l6 6-6 6V6z"/></svg></button></td>
                </tr>
                <tr>
                    <td></td>
                    <td><button class="ctrl-btn" onclick="panMap(0, 1)"><svg viewBox="0 0 24 24"><path d="M12 16l6-6H6l6 6z"/></svg></button></td>
                    <td></td>
                </tr>
            </table>
        </div>
    </div>

    <script>
        var API_KEY = '292f4474-40a3-4335-aebb-aa57f6b11d09';
        var map, currentMarker, lastPin, countryCode = "";

        var blackIcon = L.divIcon({
            html: '<svg width="30" height="42" viewBox="0 0 24 24" fill="black" stroke="white" stroke-width="1"><path d="M12 0C7.58 0 4 3.58 4 8c0 5.25 8 13 8 13s8-7.75 8-13c0-4.42-3.58-8-8-8zm0 11c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3z"/></svg>',
            className: "", iconSize: [30, 42], iconAnchor: [15, 42]
        });

        window.onload = function() {
            var saved = JSON.parse(localStorage.getItem('rekindle_maps_view') || '{"lat":51.5072,"lon":-0.1276,"zoom":13}');
            map = L.map('map', { 
                zoomControl: false, 
                attributionControl: false, 
                touchZoom: false, 
                scrollWheelZoom: false, 
                doubleClickZoom: false 
            }).setView([saved.lat, saved.lon], saved.zoom);

            L.tileLayer('https://tiles.stadiamaps.com/tiles/stamen_toner/{z}/{x}/{y}{r}.png?api_key=' + API_KEY).addTo(map);

            // Fetch country code to optimize search intent
            fetch('https://api.stadiamaps.com/geocoding/v1/reverse?point.lat=' + saved.lat + '&point.lon=' + saved.lon + '&api_key=' + API_KEY + '&size=1')
                .then(function(r){return r.json()}).then(function(d){ if(d.features && d.features[0]) countryCode = d.features[0].properties.country_code; });

            map.on('moveend', function() {
                var c = map.getCenter();
                localStorage.setItem('rekindle_maps_view', JSON.stringify({lat: c.lat, lon: c.lng, zoom: map.getZoom()}));
            });
        };

        function addPin(lat, lon) {
            if (currentMarker) map.removeLayer(currentMarker);
            lastPin = [lat, lon];
            currentMarker = L.marker([lat, lon], { icon: blackIcon }).addTo(map);
        }

        function clearSearch() { document.getElementById('search-input').value = ""; if(currentMarker) map.removeLayer(currentMarker); lastPin = null; }
        function resetView() { if(lastPin) map.setView(lastPin, 15); }
        function panMap(dx, dy) { map.panBy([dx * 100, dy * 100], { animate: false }); }

        function searchLocation() {
            var q = document.getElementById('search-input').value.trim();
            if (!q) return;
            var btn = document.getElementById('search-button');
            btn.innerText = "...";
            var url = 'https://api.stadiamaps.com/geocoding/v1/search?text=' + encodeURIComponent(q) + (q.indexOf(',') === -1 ? '&boundary.country=' + countryCode : '') + '&api_key=' + API_KEY + '&size=1';
            fetch(url).then(function(r){return r.json()}).then(function(res) {
                if (res.features && res.features.length > 0) {
                    var c = res.features[0].geometry.coordinates;
                    addPin(c[1], c[0]);
                    map.setView([c[1], c[0]], 15);
                }
                btn.innerText = "SEARCH";
            }).catch(function(){ btn.innerText = "SEARCH"; });
        }
    </script>
</body>
</html>
