<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <meta charset="UTF-8">
    <title>Maps</title>

    <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root { --vh: 1vh; }
        * { -webkit-tap-highlight-color: transparent !important; touch-action: manipulation; }
        a, button, input { color: #000000 !important; -webkit-appearance: none; appearance: none; border-radius: 0; }

        html, body {
            margin: 0; padding: 0; width: 100%;
            height: 100vh; height: calc(var(--vh, 1vh) * 100) !important;
            overflow: hidden; position: fixed;
            background-color: #ffffff; font-family: "Geneva", "Verdana", sans-serif;
        }

        .window { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
        #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #ffffff; z-index: 1; }
        
        .maplibregl-canvas, .leaflet-container { 
            width: 100% !important; height: 100% !important; 
            image-rendering: -webkit-optimize-contrast;
        }

        /* UI PANELS */
        .overlay-panel { position: absolute; background: white; border: 2px solid black; padding: 10px; z-index: 500; box-shadow: 2px 2px 0px rgba(0,0,0,0.5); }
        .panel-top-left { top: 10px; left: 10px; width: 280px; }
        
        .search-container { display: flex; flex-direction: column; gap: 8px; }
        input[type="text"] { width: 100%; padding: 8px; border: 2px solid black; box-sizing: border-box; font-size: 16px !important; }
        
        .button-row { display: flex; gap: 8px; width: 100%; }
        .sys-btn { background: white; border: 2px solid black; font-weight: bold; padding: 8px; cursor: pointer; text-transform: uppercase; box-shadow: 2px 2px 0 black; box-sizing: border-box; font-size: 0.8rem; }
        .sys-btn:active { background: black; color: white; transform: translate(2px, 2px); box-shadow: none; }
        
        #search-button { flex: 3; }
        .clear-btn { flex: 1; font-size: 18px; }
        .gpx-btn { width: 100%; margin-top: 4px; }

        .panel-bottom-right { position: absolute; bottom: 20px; right: 20px; z-index: 500; display: flex; flex-direction: column; align-items: center; }
        .zoom-controls, .d-pad { background: white; border: 2px solid black; padding: 4px; box-shadow: 4px 4px 0 black; margin-top: 10px; }
        .zoom-btn, .d-btn { width: 35px; height: 35px; background: white; border: 2px solid black; font-weight: bold; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
        .d-pad { display: grid; grid-template-columns: repeat(3, 35px); gap: 4px; }
        .d-btn.center { font-size: 0.7rem; background: #eee; }
    </style>
</head>
<body>
    <div class="window">
        <div class="overlay-panel panel-top-left">
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search..." onkeypress="if(event.key==='Enter') searchLocation()">
                <div class="button-row">
                    <button class="sys-btn" id="search-button" onclick="searchLocation()">Search</button>
                    <button class="sys-btn clear-btn" onclick="clearSearch()">X</button>
                </div>
                <button class="sys-btn gpx-btn" onclick="document.getElementById('gpx-input').click()">Load GPX Waypoints</button>
                <input type="file" id="gpx-input" accept=".gpx" style="display:none" onchange="loadGPX(this)">
            </div>
        </div>
        <div class="panel-bottom-right">
            <div class="zoom-controls">
                <button class="zoom-btn" onclick="map.zoomIn()">+</button>
                <button class="zoom-btn" onclick="map.zoomOut()">-</button>
            </div>
            <div class="d-pad">
                <div></div><button class="d-btn" onclick="panMap(0, -1)">▲</button><div></div>
                <button class="d-btn" onclick="panMap(-1, 0)">◀</button>
                <button class="d-btn center" onclick="resetView()">●</button>
                <button class="d-btn" onclick="panMap(1, 0)">▶</button>
                <div></div><button class="d-btn" onclick="panMap(0, 1)">▼</button><div></div>
            </div>
        </div>
        <div id="map"></div>
    </div>

    <script>
        let map = null;
        let mapType = 'gl';
        let waypoints = []; // Array to store multiple markers
        let lastPinCoords = null; 
        const STADIA_API_KEY = '292f4474-40a3-4335-aebb-aa57f6b11d09';
        
        const blackIcon = L.divIcon({
            html: `<svg width="30" height="42" viewBox="0 0 24 24" fill="black" stroke="white" stroke-width="1"><path d="M12 0C7.58 0 4 3.58 4 8c0 5.25 8 13 8 13s8-7.75 8-13c0-4.42-3.58-8-8-8zm0 11c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3z"/></svg>`,
            className: "", iconSize: [30, 42], iconAnchor: [15, 42]
        });

        function forceMapResize() { if (map) { if (mapType === 'gl') map.resize(); else map.invalidateSize(); } }
        function fixViewportHeight() { document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px'); forceMapResize(); }
        window.addEventListener('resize', fixViewportHeight);
        fixViewportHeight();

        window.onload = () => {
            const saved = JSON.parse(localStorage.getItem('rekindle_maps_view') || '{"lat":51.5072,"lon":-0.1276,"zoom":13}');
            if (typeof maplibregl !== 'undefined' && maplibregl.supported()) {
                mapType = 'gl';
                map = new maplibregl.Map({
                    container: 'map',
                    style: `https://tiles.stadiamaps.com/styles/stamen_toner.json?api_key=${STADIA_API_KEY}`,
                    center: [saved.lon, saved.lat], zoom: saved.zoom, attributionControl: false, fadeDuration: 0,
                    scrollZoom: false, touchZoomRotate: false, doubleClickZoom: false
                });
            } else {
                mapType = 'leaflet';
                map = L.map('map', { zoomControl: false, attributionControl: false, touchZoom: false, scrollWheelZoom: false, doubleClickZoom: false })
                    .setView([saved.lat, saved.lon], saved.zoom);
                L.tileLayer(`https://tiles.stadiamaps.com/tiles/stamen_toner/{z}/{x}/{y}{r}.png?api_key=${STADIA_API_KEY}`).addTo(map);
            }
            map.on('moveend', () => {
                const c = map.getCenter();
                localStorage.setItem('rekindle_maps_view', JSON.stringify({lat: c.lat, lon: c.lng, zoom: map.getZoom()}));
            });
        };

        function addPin(lat, lon, isGPX = false) {
            if (!isGPX) clearMarkers(); // Search results clear the map, GPX adds to it
            
            lastPinCoords = {lat: lat, lon: lon};
            let marker;
            
            if (mapType === 'gl') {
                marker = new maplibregl.Marker({ color: 'black' }).setLngLat([lon, lat]).addTo(map);
            } else {
                marker = L.marker([lat, lon], { icon: blackIcon }).addTo(map);
            }
            waypoints.push(marker);
        }

        function clearMarkers() {
            waypoints.forEach(m => {
                if (mapType === 'gl') m.remove();
                else map.removeLayer(m);
            });
            waypoints = [];
            lastPinCoords = null;
        }

        function clearSearch() {
            document.getElementById('search-input').value = "";
            document.getElementById('gpx-input').value = "";
            clearMarkers();
        }

        function resetView() {
            if (lastPinCoords) {
                if (mapType === 'gl') map.jumpTo({ center: [lastPinCoords.lon, lastPinCoords.lat], zoom: 15 });
                else map.setView([lastPinCoords.lat, lastPinCoords.lon], 15);
            }
        }

        // --- GPX PROCESSING ---
        function loadGPX(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const parser = new DOMParser();
                const xml = parser.parseFromString(e.target.result, "text/xml");
                const wpts = xml.getElementsByTagName("wpt");
                
                if (wpts.length === 0) return alert("No waypoints found in GPX.");

                clearMarkers();
                const bounds = mapType === 'gl' ? new maplibregl.LngLatBounds() : L.latLngBounds();

                for (let i = 0; i < wpts.length; i++) {
                    const lat = parseFloat(wpts[i].getAttribute("lat"));
                    const lon = parseFloat(wpts[i].getAttribute("lon"));
                    addPin(lat, lon, true);
                    
                    if (mapType === 'gl') bounds.extend([lon, lat]);
                    else bounds.extend([lat, lon]);
                }

                // Center map on the loaded GPX data
                if (mapType === 'gl') map.fitBounds(bounds, { padding: 50 });
                else map.fitBounds(bounds, { padding: [50, 50] });
            };
            reader.readAsText(file);
        }

        async function searchLocation() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;
            const btn = document.getElementById('search-button');
            const originalText = btn.innerText;
            btn.innerText = "...";
            try {
                const isExplicit = /[,]|UK|U\.K|United Kingdom|Australia|USA|U\.S|States|France|Germany|Japan/i.test(query);
                let lat, lon;
                if (!isExplicit) {
                    const c = map.getCenter();
                    const revUrl = `https://api.stadiamaps.com/geocoding/v1/reverse?point.lat=${c.lat}&point.lon=${c.lng}&api_key=${STADIA_API_KEY}&size=1`;
                    const revRes = await fetch(revUrl);
                    const revData = await revRes.json();
                    let countryCode = (revData.features && revData.features.length > 0) ? revData.features[0].properties.country_code : "";
                    const localUrl = `https://api.stadiamaps.com/geocoding/v1/search?text=${encodeURIComponent(query)}&boundary.country=${countryCode}&api_key=${STADIA_API_KEY}&size=1`;
                    const localRes = await fetch(localUrl);
                    const localData = await localRes.json();
                    if (localData.features && localData.features.length > 0) [lon, lat] = localData.features[0].geometry.coordinates;
                }
                if (!lat || !lon) {
                    const globalUrl = `https://api.stadiamaps.com/geocoding/v1/search?text=${encodeURIComponent(query)}&api_key=${STADIA_API_KEY}&size=1`;
                    const globalRes = await fetch(globalUrl);
                    const globalData = await globalRes.json();
                    if (globalData.features && globalData.features.length > 0) [lon, lat] = globalData.features[0].geometry.coordinates;
                }
                if (lat && lon) {
                    addPin(lat, lon);
                    if (mapType === 'gl') map.jumpTo({ center: [lon, lat], zoom: 15 });
                    else map.setView([lat, lon], 15);
                }
            } catch (e) { console.error(e); } finally { btn.innerText = originalText; }
        }

        function panMap(dx, dy) { map.panBy([dx * 100, dy * 100], { animate: false }); }
    </script>
</body>
</html>
