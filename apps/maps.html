<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <meta charset="UTF-8">
    <title>Maps</title>

    <!-- Leaflet ONLY (Bulletproof raster map, no fragile WebGL) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
        }

        /* Ironclad Fullscreen */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            overflow: hidden !important;
            background-color: #ffffff;
            font-family: "Geneva", "Verdana", sans-serif;
            box-sizing: border-box;
        }

        .title-bar { display: none; }

        .window {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: none;
            background-color: #ffffff;
        }

        #map {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #ffffff;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            z-index: 1;
        }

        /* Standard OpenStreetMap, converted to B&W for E-ink */
        .leaflet-layer {
            filter: grayscale(100%);
        }

        .leaflet-tile-container {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        /* UI PANELS */
        .overlay-panel {
            position: absolute;
            background: white;
            border: 2px solid black;
            padding: 10px;
            z-index: 500;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }

        .panel-top-left {
            top: 10px;
            left: 10px;
            width: 260px;
        }

        input[type="text"] { width: 100%; padding: 6px; border: 2px solid black; box-sizing: border-box; margin-bottom: 5px; font-family: inherit; }
        button.sys-btn { width: 100%; background: white; border: 2px solid black; font-weight: bold; padding: 5px; cursor: pointer; text-transform: uppercase; box-shadow: 2px 2px 0 black; box-sizing: border-box;}
        button.sys-btn:active { background: black; color: white; transform: translate(2px, 2px); box-shadow: none; }
        
        .panel-bottom-right { 
            position: absolute; 
            bottom: 20px; 
            right: 20px; 
            z-index: 500; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }

        .panel-bottom-right > * + * { margin-top: 10px; }

        .zoom-controls {
            display: flex;
            flex-direction: column;
            background: white;
            border: 2px solid black;
            padding: 4px;
            box-shadow: 4px 4px 0 black;
        }

        .zoom-controls > * + * { margin-top: 4px; }

        .zoom-btn { width: 35px; height: 35px; background: white; border: 2px solid black; font-weight: 900; font-size: 1.2rem; cursor: pointer; }
        .zoom-btn:active { background: black; color: white; }

        .d-pad {
            display: grid;
            grid-template-columns: 35px 35px 35px;
            grid-template-rows: 35px 35px 35px;
            gap: 4px; 
            background: white;
            border: 2px solid black;
            padding: 4px;
            box-shadow: 4px 4px 0 black;
        }

        .d-btn {
            width: 100%;
            height: 100%;
            background: white;
            border: 2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.2rem;
            margin: 0;
            padding: 0;
        }

        .d-btn:active { background: black; color: white; }
        .d-btn.center { font-size: 0.7rem; background: #eee; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.95);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-box {
            background: white;
            border: 4px double black;
            padding: 20px;
            width: 80%;
            max-width: 300px;
            text-align: center;
            box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }
    </style>

    <script src="js/i18n.js"></script>
    <script src="theme.js"></script>
</head>

<body>

    <div class="window">
        <div class="overlay-panel panel-top-left">
            <div>
                <input type="text" id="search-input" placeholder="Search location..." onkeypress="if(event.key==='Enter') searchLocation()">
                <button class="sys-btn" onclick="searchLocation()">Search</button>
            </div>
        </div>

        <div class="panel-bottom-right">
            <div class="zoom-controls">
                <button class="zoom-btn" onclick="map.zoomIn()">+</button>
                <button class="zoom-btn" onclick="map.zoomOut()">-</button>
            </div>

            <div class="d-pad">
                <div></div>
                <button class="d-btn" onclick="panMap(0, -1)">▲</button>
                <div></div>

                <button class="d-btn" onclick="panMap(-1, 0)">◀</button>
                <button class="d-btn center" onclick="resetView()">●</button>
                <button class="d-btn" onclick="panMap(1, 0)">▶</button>

                <div></div>
                <button class="d-btn" onclick="panMap(0, 1)">▼</button>
                <div></div>
            </div>
        </div>

        <div id="map"></div>
    </div>

    <div id="status-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="status-title" style="margin-top:0;">Status</h3>
            <p id="status-message" style="font-size:0.9rem; margin-bottom:15px; font-weight:bold;"></p>
            <button class="sys-btn" onclick="document.getElementById('status-modal').style.display='none'">OK</button>
        </div>
    </div>

    <script>
        function showStatus(title, msg) {
            document.getElementById('status-title').innerText = title;
            document.getElementById('status-message').innerText = msg;
            document.getElementById('status-modal').style.display = 'flex';
        }

        async function fetchWithProxyFallback(targetUrl, options = {}) {
            try {
                const res = await fetch(targetUrl, {
                    ...options,
                    headers: { 'Accept-Language': 'en' }
                });
                if (!res.ok) throw new Error(`API error: ${res.status}`);
                return res;
            } catch (e) {
                console.error("Direct fetch failed:", e);
                throw e;
            }
        }

        let map;
        const defaultCenterLat = 51.5072;
        const defaultCenterLon = -0.1276;
        const defaultZoom = 13;

        function getSavedState(key, fallback) {
            try {
                const saved = localStorage.getItem(key);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed && typeof parsed.lat === 'number' && typeof parsed.lon === 'number') {
                        return parsed;
                    }
                }
            } catch (e) {}
            return fallback;
        }

        function saveMapState() {
            if (!map) return;
            const center = map.getCenter();
            const zoom = map.getZoom();
            try {
                localStorage.setItem('rekindle_maps_view', JSON.stringify({ lat: center.lat, lon: center.lng, zoom: zoom }));
            } catch (e) {}
        }

        let initialView = getSavedState('rekindle_maps_view', { lat: defaultCenterLat, lon: defaultCenterLon, zoom: defaultZoom });
        let lastSearchedLoc = getSavedState('rekindle_maps_search', { lat: defaultCenterLat, lon: defaultCenterLon });

        window.onload = () => {
            initMap();
        };

        window.addEventListener('resize', () => {
            if (map) map.invalidateSize();
        });

        function initMap() {
            map = L.map('map', {
                zoomControl: false,
                attributionControl: false,
                zoomAnimation: false, 
                fadeAnimation: false,
                markerZoomAnimation: false
            }).setView([initialView.lat, initialView.lon], initialView.zoom || defaultZoom);

            // Public, free OpenStreetMap tiles (NO API KEY REQUIRED)
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                minZoom: 0,
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            map.on('moveend', saveMapState);
            map.on('zoomend', saveMapState);
            
            // Force rendering refresh
            setTimeout(() => { map.invalidateSize(); }, 200);
        }

        async function searchLocation() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;
            try {
                const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`;
                const res = await fetchWithProxyFallback(url);
                const data = await res.json();
                
                if (data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    
                    lastSearchedLoc = { lat: lat, lon: lon };
                    try { localStorage.setItem('rekindle_maps_search', JSON.stringify(lastSearchedLoc)); } catch(e) {}

                    map.setView([lat, lon], 15);
                } else {
                    showStatus("Not Found", "No results found for your query.");
                }
            } catch (e) {
                console.error(e);
                showStatus("Error", "Search failed. Check your connection.");
            }
        }

        function panMap(dx, dy) {
            map.panBy([dx * 100, dy * 100], { duration: 0, animate: false });
        }

        function resetView() {
            map.setView([lastSearchedLoc.lat, lastSearchedLoc.lon], 13);
        }
    </script>
</body>
</html>
