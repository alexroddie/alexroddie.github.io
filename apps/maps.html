<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <meta charset="UTF-8">
    <title>Maps (Standalone)</title>

    <!-- MapLibre GL JS (v2 for Kindle compatibility) -->
    <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />

    <!-- Leaflet (Fallback for Kindle/No-WebGL) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border: 2px solid #000000;
        }

        body {
            font-family: "Geneva", "Verdana", sans-serif;
            margin: 0;
            padding: 0 !important; /* Full screen - remove 20px gutter */
            height: 100vh;
            overflow: hidden;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* HIDE THE WINDOW CHROME */
        .title-bar { display: none; }

        .window {
            width: 100vw;
            height: 100vh;
            border: none; /* Remove retro border */
            max-width: none;
            display: flex;
            flex-direction: column;
        }

        #map {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI PANELS */
        .overlay-panel {
            position: absolute;
            background: white;
            border: 2px solid black;
            padding: 10px;
            z-index: 500;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }

        .panel-top-left {
            top: 10px; /* Adjusted since title bar is gone[cite: 1] */
            left: 10px;
            width: 260px;
        }

        /* MINIMALIST HOME BUTTON */
        .home-btn {
            background: white;
            border: 2px solid black;
            font-weight: bold;
            padding: 2px 8px;
            cursor: pointer;
            margin-bottom: 8px;
            display: inline-block;
            text-decoration: none;
            color: black;
            font-size: 0.8rem;
        }

        /* Standard ReKindle button styles kept for search[cite: 1] */
        .tab-row { display: flex; border-bottom: 2px solid black; margin-bottom: 10px; }
        .tab-btn { flex: 1; padding: 5px; cursor: pointer; background: #eee; border: none; font-weight: bold; }
        .tab-btn.active { background: black; color: white; }
        input[type="text"] { width: 100%; padding: 6px; border: 2px solid black; box-sizing: border-box; margin-bottom: 5px; }
        button.sys-btn { width: 100%; background: white; border: 2px solid black; font-weight: bold; padding: 5px; cursor: pointer; text-transform: uppercase; }
        
        .panel-bottom-right { position: absolute; bottom: 20px; right: 20px; z-index: 500; display: flex; flex-direction: column; gap: 10px; }
        .zoom-btn, .d-btn { width: 35px; height: 35px; background: white; border: 2px solid black; font-weight: bold; cursor: pointer; }
    </style>

    <script src="js/i18n.js"></script>
    <script src="theme.js"></script>
</head>

<body>

    <div class="window">
        <div class="overlay-panel panel-top-left">
            <!-- Back to your main bookmarks page[cite: 1] -->
            <a href="https://alexroddie.github.io/" class="home-btn">← HOME</a>
            
            <div class="tab-row">
                <button class="tab-btn active" id="tab-find" onclick="setMode('find')">Find</button>
                <button class="tab-btn" id="tab-route" onclick="setMode('route')">Route</button>
            </div>

            <div id="mode-find-content">
                <input type="text" id="search-input" placeholder="Search location..." onkeypress="if(event.key==='Enter') searchLocation()">
                <button class="sys-btn" onclick="searchLocation()">Go</button>
            </div>

            <div id="mode-route-content" style="display:none;">
                <input type="text" id="route-start" placeholder="Start (empty for center)">
                <input type="text" id="route-end" placeholder="Destination">
                <button class="sys-btn" onclick="calcRoute()">Get Route</button>
            </div>
        </div>

        <div class="panel-bottom-right">
            <button class="zoom-btn" onclick="map.zoomIn()">+</button>
            <button class="zoom-btn" onclick="map.zoomOut()">-</button>
        </div>

        <div id="map"></div>
    </div>

    <script>
        // --- DIRECT FETCH LOGIC (NO PROXY)[cite: 1] ---
        async function fetchWithProxyFallback(targetUrl, options = {}) {
            try {
                // Fetch directly from the map provider instead of a proxy[cite: 1]
                const res = await fetch(targetUrl, {
                    ...options,
                    headers: { 'Accept-Language': 'en' }
                });
                if (!res.ok) throw new Error(`API error: ${res.status}`);
                return res;
            } catch (e) {
                console.error("Direct fetch failed:", e);
                throw e;
            }
        }

        // --- MAP INITIALIZATION ---
        let map;
        let markers = [];
        let mapType = 'gl';

        window.onload = () => {
            initMap();
        };

        async function initMap() {
            if (typeof maplibregl !== 'undefined' && maplibregl.supported && maplibregl.supported()) {
                mapType = 'gl';
                map = new maplibregl.Map({
                    container: 'map',
                    style: 'https://openmaptiles.geo.data.gouv.fr/styles/maptiler-toner/style.json',
                    center: [-74.0060, 40.7128],
                    zoom: 13,
                    attributionControl: false
                });
            } else {
                mapType = 'leaflet';
                map = L.map('map', { zoomControl: false }).setView([40.7128, -74.0060], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            }
        }

        function setMode(mode) {
            document.getElementById('mode-find-content').style.display = mode === 'find' ? 'block' : 'none';
            document.getElementById('mode-route-content').style.display = mode === 'route' ? 'block' : 'none';
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.id === `tab-${mode}`));
        }

        async function searchLocation() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;
            try {
                const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`;
                const res = await fetchWithProxyFallback(url);
                const data = await res.json();
                if (data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    if (mapType === 'gl') map.jumpTo({ center: [lon, lat], zoom: 15 });
                    else map.setView([lat, lon], 15);
                }
            } catch (e) { alert("Search failed: " + e.message); }
        }
    </script>
</body>
</html>
