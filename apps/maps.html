<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maps</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* Global Reset for Consistency */
        * { 
            -webkit-tap-highlight-color: transparent !important; 
            box-sizing: border-box !important; 
            margin: 0; padding: 0;
        }

        button, input { 
            color: #000000 !important; 
            border-radius: 0; 
            font-family: "Geneva", "Verdana", sans-serif;
            outline: none; 
            background: #ffffff;
            border: 2px solid black;
            display: block;
        }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden; position: fixed; 
            background-color: #ffffff;
        }

        #map { 
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; 
            width: 100%; height: 100%; 
            background: #ffffff; z-index: 1; 
        }

        /* 4px Shadow Panel - Standardized Padding at 10px */
        .shadow-panel { 
            background: #ffffff; 
            border: 2px solid #000000; 
            z-index: 500; 
            box-shadow: 4px 4px 0 #000000; 
            position: absolute;
            padding: 10px;
        }

        /* --- SEARCH CLUSTER --- */
        .panel-top-left { top: 10px; left: 10px; width: 260px; }
        
        #search-input { 
            width: 100%; height: 36px; padding: 0 8px; 
            font-size: 16px !important; margin-bottom: 10px;
        }
        
        .button-row { width: 100%; height: 36px; }
        
        .sys-btn { 
            font-weight: bold; cursor: pointer; text-transform: uppercase; 
            height: 36px; line-height: 32px; text-align: center; float: left;
        }
        .sys-btn:active { background: #000000; color: #ffffff !important; }
        
        #search-button { width: 170px; margin-right: 10px; } /* 10px Gap */
        .clear-btn { width: 60px; font-size: 18px; }

        /* --- NAVIGATION CLUSTER --- */
        .nav-panel { bottom: 20px; right: 20px; display: table; }

        .nav-cell { display: table-cell; vertical-align: middle; }
        .panning-cell { padding-right: 10px; } /* 10px Gap between panning and zoom */

        /* All Buttons now 35x35px */
        .dpad-table { border-collapse: separate; border-spacing: 10px; margin: -10px; }
        
        .ctrl-btn { 
            width: 35px; height: 35px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .ctrl-btn svg { display: block; width: 16px; height: 16px; }
        
        /* Zoom Specifics */
        .zoom-container { width: 35px; }
        .zoom-sep { height: 10px; } /* 10px Gap */

        .ctrl-btn:active { background: #000000; }
        .ctrl-btn:active svg { fill: #ffffff; }

        .clearfix:after { content: ""; display: table; clear: both; }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Search Panel -->
    <div class="shadow-panel panel-top-left">
        <input type="text" id="search-input" placeholder="Search..." onkeypress="handleKeyPress(event)">
        <div class="button-row clearfix">
            <button class="sys-btn" id="search-button" onclick="searchLocation()">SEARCH</button>
            <button class="sys-btn clear-btn" onclick="clearSearch()">X</button>
        </div>
    </div>

    <!-- Unified Navigation Cluster -->
    <div class="shadow-panel nav-panel">
        <div class="nav-cell panning-cell">
            <table class="dpad-table">
                <tr>
                    <td></td>
                    <td><button class="ctrl-btn" onclick="panMap(0, -1)"><svg viewBox="0 0 24 24"><path d="M12 8l-6 6h12l-6-6z"/></svg></button></td>
                    <td></td>
                </tr>
                <tr>
                    <td><button class="ctrl-btn" onclick="panMap(-1, 0)"><svg viewBox="0 0 24 24"><path d="M16 6l-6 6 6 6V6z"/></svg></button></td>
                    <td><button class="ctrl-btn" style="background:#fff" onclick="resetView()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></svg></button></td>
                    <td><button class="ctrl-btn" onclick="panMap(1, 0)"><svg viewBox="0 0 24 24"><path d="M8 6l6 6-6 6V6z"/></svg></button></td>
                </tr>
                <tr>
                    <td></td>
                    <td><button class="ctrl-btn" onclick="panMap(0, 1)"><svg viewBox="0 0 24 24"><path d="M12 16l6-6H6l6 6z"/></svg></button></td>
                    <td></td>
                </tr>
            </table>
        </div>

        <div class="nav-cell">
            <div class="zoom-container">
                <button class="ctrl-btn" onclick="map.zoomIn()"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>
                <div class="zoom-sep"></div>
                <button class="ctrl-btn" onclick="map.zoomOut()"><svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg></button>
            </div>
        </div>
    </div>

    <script>
        var STADIA_API_KEY = '292f4474-40a3-4335-aebb-aa57f6b11d09';
        var map = null;
        var currentMarker = null;
        var lastPinCoords = null; 

        var blackIcon = L.divIcon({
            html: '<svg width="30" height="42" viewBox="0 0 24 24" fill="black" stroke="white" stroke-width="1"><path d="M12 0C7.58 0 4 3.58 4 8c0 5.25 8 13 8 13s8-7.75 8-13c0-4.42-3.58-8-8-8zm0 11c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3z"/></svg>',
            className: "", iconSize: [30, 42], iconAnchor: [15, 42]
        });

        window.onload = function() {
            var savedData = localStorage.getItem('rekindle_maps_view');
            var saved = savedData ? JSON.parse(savedData) : {lat: 51.5072, lon: -0.1276, zoom: 13};
            
            map = L.map('map', { 
                zoomControl: false, 
                attributionControl: false, 
                touchZoom: false, 
                scrollWheelZoom: false, 
                doubleClickZoom: false 
            }).setView([saved.lat, saved.lon], saved.zoom);

            L.tileLayer('https://tiles.stadiamaps.com/tiles/stamen_toner/{z}/{x}/{y}{r}.png?api_key=' + STADIA_API_KEY).addTo(map);

            map.on('moveend', function() {
                var c = map.getCenter();
                localStorage.setItem('rekindle_maps_view', JSON.stringify({
                    lat: c.lat, lon: c.lng, zoom: map.getZoom()
                }));
            });
        };

        function addPin(lat, lon) {
            if (currentMarker) map.removeLayer(currentMarker);
            lastPinCoords = {lat: lat, lon: lon};
            currentMarker = L.marker([lat, lon], { icon: blackIcon }).addTo(map);
        }

        function clearSearch() { 
            document.getElementById('search-input').value = ""; 
            if (currentMarker) map.removeLayer(currentMarker);
            lastPinCoords = null;
        }

        function resetView() { 
            if (lastPinCoords) map.setView([lastPinCoords.lat, lastPinCoords.lon], 15); 
        }

        function panMap(dx, dy) { 
            map.panBy([dx * 100, dy * 100], { animate: false }); 
        }

        function handleKeyPress(e) {
            if (e.keyCode === 13) searchLocation();
        }

        function searchLocation() {
            var query = document.getElementById('search-input').value.trim();
            if (!query) return;
            var btn = document.getElementById('search-button');
            btn.innerText = "...";

            var c = map.getCenter();
            var revUrl = 'https://api.stadiamaps.com/geocoding/v1/reverse?point.lat=' + c.lat + '&point.lon=' + c.lng + '&api_key=' + STADIA_API_KEY + '&size=1';

            fetch(revUrl).then(function(r) { return r.json(); }).then(function(revData) {
                var code = (revData.features && revData.features.length > 0) ? revData.features[0].properties.country_code : "";
                var searchUrl = 'https://api.stadiamaps.com/geocoding/v1/search?text=' + encodeURIComponent(query) + '&boundary.country=' + code + '&api_key=' + STADIA_API_KEY + '&size=1';
                return fetch(searchUrl);
            }).then(function(r) { return r.json(); }).then(function(res) {
                if (res.features && res.features.length > 0) {
                    var coords = res.features[0].geometry.coordinates;
                    addPin(coords[1], coords[0]); 
                    resetView();
                }
                btn.innerText = "SEARCH";
            }).catch(function(err) {
                btn.innerText = "SEARCH";
            });
        }
    </script>
</body>
</html>
