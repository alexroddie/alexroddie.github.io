<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maps</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* Legacy Reset for Kindle Compatibility */
        * { 
            -webkit-tap-highlight-color: transparent !important; 
            box-sizing: border-box !important; 
            margin: 0; padding: 0;
        }

        button, input { 
            color: #000000 !important; 
            border-radius: 0; 
            font-family: "Geneva", "Verdana", sans-serif;
            outline: none; 
            background: #ffffff;
            border: 2px solid black;
        }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden; position: fixed; 
            background-color: #ffffff;
        }

        #map { 
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; 
            width: 100%; height: 100%; 
            background: #ffffff; z-index: 1; 
        }

        /* Standardized Shadow Panel - 4px offset */
        .shadow-panel { 
            background: #ffffff; 
            border: 2px solid #000000; 
            z-index: 500; 
            box-shadow: 4px 4px 0 #000000; 
            position: absolute;
        }

        /* --- SEARCH CLUSTER: Pixel-Locked --- */
        .panel-top-left { 
            top: 10px; left: 10px; width: 260px; padding: 10px; 
        }
        
        #search-input { 
            width: 100%; height: 36px; padding: 0 8px; 
            font-size: 16px !important; margin-bottom: 10px; display: block;
        }
        
        .button-row { width: 100%; height: 36px; display: block; }
        
        .sys-btn { 
            font-weight: bold; cursor: pointer; text-transform: uppercase; 
            height: 36px; line-height: 32px; text-align: center; float: left;
        }
        .sys-btn:active { background: #000000; color: #ffffff !important; }
        
        #search-button { width: 170px; margin-right: 10px; }
        .clear-btn { width: 56px; font-size: 18px; }

        /* --- NAVIGATION COLUMN: Centered & Consistent --- */
        .nav-column { 
            position: absolute; bottom: 20px; right: 20px; 
            z-index: 500; width: 135px; text-align: center;
        }

        /* Zoom Panel - Matching padding of panning panel */
        .zoom-panel { 
            position: relative; display: inline-block; 
            padding: 10px; margin-bottom: 15px;
        }
        .zoom-btn { 
            width: 35px; height: 35px; font-weight: bold; 
            font-size: 1.2rem; display: block; line-height: 31px;
        }
        .zoom-sep { height: 6px; }

        /* Panning Panel */
        .dpad-panel { 
            position: relative; display: inline-block; padding: 10px; 
        }
        .dpad-table { border-collapse: separate; border-spacing: 6px; }
        
        .d-btn { 
            width: 35px; height: 35px; font-weight: bold; 
            font-size: 1.2rem; display: block; line-height: 31px;
        }
        .d-btn.center { font-size: 0.8rem; background: #ffffff; }

        /* Helper for Clearing Floats */
        .clearfix:after { content: ""; display: table; clear: both; }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Search Panel -->
    <div class="shadow-panel panel-top-left">
        <input type="text" id="search-input" placeholder="Search..." onkeypress="handleKeyPress(event)">
        <div class="button-row clearfix">
            <button class="sys-btn" id="search-button" onclick="searchLocation()">SEARCH</button>
            <button class="sys-btn clear-btn" onclick="clearSearch()">X</button>
        </div>
    </div>

    <!-- Navigation Column -->
    <div class="nav-column">
        <!-- Zoom Panel -->
        <div class="shadow-panel zoom-panel">
            <button class="zoom-btn" onclick="map.zoomIn()">+</button>
            <div class="zoom-sep"></div>
            <button class="zoom-btn" onclick="map.zoomOut()">-</button>
        </div>
        
        <!-- Panning Panel -->
        <div class="shadow-panel dpad-panel">
            <table class="dpad-table">
                <tr>
                    <td></td><td><button class="d-btn" onclick="panMap(0, -1)">▲</button></td><td></td>
                </tr>
                <tr>
                    <td><button class="d-btn" onclick="panMap(-1, 0)">◀</button></td>
                    <td><button class="d-btn center" onclick="resetView()">●</button></td>
                    <td><button class="d-btn" onclick="panMap(1, 0)">▶</button></td>
                </tr>
                <tr>
                    <td></td><td><button class="d-btn" onclick="panMap(0, 1)">▼</button></td><td></td>
                </tr>
            </table>
        </div>
    </div>

    <script>
        // Use VAR and standard strings for Kindle compatibility
        var STADIA_API_KEY = '292f4474-40a3-4335-aebb-aa57f6b11d09';
        var map = null;
        var currentMarker = null;
        var lastPinCoords = null; 

        var blackIcon = L.divIcon({
            html: '<svg width="30" height="42" viewBox="0 0 24 24" fill="black" stroke="white" stroke-width="1"><path d="M12 0C7.58 0 4 3.58 4 8c0 5.25 8 13 8 13s8-7.75 8-13c0-4.42-3.58-8-8-8zm0 11c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3z"/></svg>',
            className: "", iconSize: [30, 42], iconAnchor: [15, 42]
        });

        window.onload = function() {
            var savedData = localStorage.getItem('rekindle_maps_view');
            var saved = savedData ? JSON.parse(savedData) : {lat: 51.5072, lon: -0.1276, zoom: 13};
            
            // Basic Leaflet Init
            map = L.map('map', { 
                zoomControl: false, 
                attributionControl: false, 
                touchZoom: false, 
                scrollWheelZoom: false, 
                doubleClickZoom: false 
            }).setView([saved.lat, saved.lon], saved.zoom);

            var tileUrl = 'https://tiles.stadiamaps.com/tiles/stamen_toner/{z}/{x}/{y}{r}.png?api_key=' + STADIA_API_KEY;
            L.tileLayer(tileUrl).addTo(map);

            map.on('moveend', function() {
                var c = map.getCenter();
                localStorage.setItem('rekindle_maps_view', JSON.stringify({
                    lat: c.lat, 
                    lon: c.lng, 
                    zoom: map.getZoom()
                }));
            });
        };

        function addPin(lat, lon) {
            clearMarker();
            lastPinCoords = {lat: lat, lon: lon};
            currentMarker = L.marker([lat, lon], { icon: blackIcon }).addTo(map);
        }

        function clearMarker() {
            if (currentMarker) { 
                map.removeLayer(currentMarker); 
                currentMarker = null; 
            }
            lastPinCoords = null;
        }

        function clearSearch() { 
            document.getElementById('search-input').value = ""; 
            clearMarker(); 
        }

        function resetView() { 
            if (lastPinCoords) {
                map.setView([lastPinCoords.lat, lastPinCoords.lon], 15); 
            }
        }

        function panMap(dx, dy) { 
            map.panBy([dx * 100, dy * 100], { animate: false }); 
        }

        function handleKeyPress(e) {
            if (e.keyCode === 13) searchLocation();
        }

        function searchLocation() {
            var query = document.getElementById('search-input').value.trim();
            if (!query) return;
            var btn = document.getElementById('search-button');
            btn.innerText = "...";

            var c = map.getCenter();
            var revUrl = 'https://api.stadiamaps.com/geocoding/v1/reverse?point.lat=' + c.lat + '&point.lon=' + c.lng + '&api_key=' + STADIA_API_KEY + '&size=1';

            fetch(revUrl).then(function(r) { return r.json(); }).then(function(revData) {
                var code = (revData.features && revData.features.length > 0) ? revData.features[0].properties.country_code : "";
                var searchUrl = 'https://api.stadiamaps.com/geocoding/v1/search?text=' + encodeURIComponent(query) + '&boundary.country=' + code + '&api_key=' + STADIA_API_KEY + '&size=1';
                
                return fetch(searchUrl);
            }).then(function(r) { return r.json(); }).then(function(res) {
                if (res.features && res.features.length > 0) {
                    var coords = res.features[0].geometry.coordinates;
                    addPin(coords[1], coords[0]); 
                    resetView();
                }
                btn.innerText = "SEARCH";
            }).catch(function(err) {
                btn.innerText = "SEARCH";
            });
        }
    </script>
</body>
</html>
