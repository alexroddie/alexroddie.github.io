<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <meta charset="UTF-8">
    <title>Maps</title>

    <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root { --vh: 1vh; }
        * { -webkit-tap-highlight-color: transparent !important; touch-action: manipulation; }
        a, button, input { color: #000000 !important; -webkit-appearance: none; appearance: none; border-radius: 0; }

        html, body {
            margin: 0; padding: 0; width: 100%;
            height: 100vh; height: calc(var(--vh, 1vh) * 100) !important;
            overflow: hidden; position: fixed;
            background-color: #ffffff; font-family: "Geneva", "Verdana", sans-serif;
        }

        .window { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
        #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #ffffff; z-index: 1; }
        
        .maplibregl-canvas, .leaflet-container { 
            width: 100% !important; height: 100% !important; 
            image-rendering: -webkit-optimize-contrast;
        }

        /* SEARCH UI (Per Screenshot 2026-05-05 at 08.40.07.png) */
        .overlay-panel { position: absolute; background: white; border: 2px solid black; padding: 10px; z-index: 500; box-shadow: 2px 2px 0px rgba(0,0,0,0.5); }
        .panel-top-left { top: 10px; left: 10px; width: 260px; }
        .search-container { display: flex; flex-direction: column; gap: 8px; }
        input[type="text"] { width: 100%; padding: 8px; border: 2px solid black; box-sizing: border-box; font-size: 16px !important; }
        .button-row { display: flex; gap: 8px; width: 100%; }
        .sys-btn { background: white; border: 2px solid black; font-weight: bold; padding: 8px; cursor: pointer; text-transform: uppercase; box-shadow: 2px 2px 0 black; box-sizing: border-box; }
        .sys-btn:active { background: black; color: white; transform: translate(2px, 2px); box-shadow: none; }
        #search-button { flex: 3; }
        .clear-btn { flex: 1; font-size: 18px; }

        /* NAV CLUSTER */
        .panel-bottom-right { position: absolute; bottom: 20px; right: 20px; z-index: 500; display: flex; flex-direction: column; align-items: center; }
        .zoom-controls, .d-pad { background: white; border: 2px solid black; padding: 4px; box-shadow: 4px 4px 0 black; margin-top: 10px; }
        .zoom-btn, .d-btn { width: 35px; height: 35px; background: white; border: 2px solid black; font-weight: bold; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
        .d-pad { display: grid; grid-template-columns: repeat(3, 35px); gap: 4px; }
        .d-btn.center { font-size: 0.7rem; background: #eee; }

        /* LABELS */
        .marker-label {
            background: white;
            border: 1px solid black;
            padding: 1px 4px;
            font-size: 10px;
            font-weight: bold;
            white-space: nowrap;
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="window">
        <div id="map"></div>
        <div class="overlay-panel panel-top-left">
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search..." onkeypress="if(event.key==='Enter') searchLocation()">
                <div class="button-row">
                    <button class="sys-btn" id="search-button" onclick="searchLocation()">Search</button>
                    <button class="sys-btn clear-btn" onclick="clearSearch()">X</button>
                </div>
            </div>
        </div>
        <div class="panel-bottom-right">
            <div class="zoom-controls">
                <button class="zoom-btn" onclick="map.zoomIn()">+</button>
                <button class="zoom-btn" onclick="map.zoomOut()">-</button>
            </div>
            <div class="d-pad">
                <div></div><button class="d-btn" onclick="panMap(0, -1)">▲</button><div></div>
                <button class="d-btn" onclick="panMap(-1, 0)">◀</button>
                <button class="d-btn center" onclick="resetView()">●</button>
                <button class="d-btn" onclick="panMap(1, 0)">▶</button>
                <div></div><button class="d-btn" onclick="panMap(0, 1)">▼</button><div></div>
            </div>
        </div>
    </div>

    <script>
        const STADIA_API_KEY = '292f4474-40a3-4335-aebb-aa57f6b11d09';
        let map = null;
        let mapType = 'gl';
        let searchMarker = null;
        let lastPinCoords = null;
        let gpxData = []; // Store waypoints for local search

        // SVG Path Icons
        const ICON_PATHS = {
            bothy: `<path d="M12 3L2 12h3v8h14v-8h3L12 3zm0 13a2 2 0 110-4 2 2 0 010 4z"/>`,
            munro: `<path d="M12 2L1 21h22L12 2zm0 4l6.5 11h-13L12 6z"/>`,
            search: `<path d="M12 0C7.58 0 4 3.58 4 8c0 5.25 8 13 8 13s8-7.75 8-13c0-4.42-3.58-8-8-8zm0 11a3 3 0 110-6 3 3 0 010 6z"/>`
        };

        function fixViewportHeight() { document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px'); if(map){ if(mapType==='gl') map.resize(); else map.invalidateSize(); } }
        window.addEventListener('resize', fixViewportHeight);
        fixViewportHeight();

        window.onload = () => {
            const saved = JSON.parse(localStorage.getItem('rekindle_maps_view') || '{"lat":51.5072,"lon":-0.1276,"zoom":13}');
            if (typeof maplibregl !== 'undefined' && maplibregl.supported()) {
                mapType = 'gl';
                map = new maplibregl.Map({
                    container: 'map',
                    style: `https://tiles.stadiamaps.com/styles/stamen_toner.json?api_key=${STADIA_API_KEY}`,
                    center: [saved.lon, saved.lat], zoom: saved.zoom, attributionControl: false, fadeDuration: 0,
                    scrollZoom: false, touchZoomRotate: false, doubleClickZoom: false
                });
            } else {
                mapType = 'leaflet';
                map = L.map('map', { zoomControl: false, attributionControl: false, touchZoom: false, scrollWheelZoom: false, doubleClickZoom: false }).setView([saved.lat, saved.lon], saved.zoom);
                L.tileLayer(`https://tiles.stadiamaps.com/tiles/stamen_toner/{z}/{x}/{y}{r}.png?api_key=${STADIA_API_KEY}`).addTo(map);
            }
            map.on('moveend', () => {
                const c = map.getCenter();
                localStorage.setItem('rekindle_maps_view', JSON.stringify({lat: c.lat, lon: c.lng, zoom: map.getZoom()}));
            });

            // Load permanent waypoints
            loadGPX('data/bothies.gpx', 'bothy');
            loadGPX('data/munros.gpx', 'munro');
        };

        async function loadGPX(url, type) {
            try {
                const res = await fetch(url);
                const text = await res.text();
                const xml = new DOMParser().parseFromString(text, "text/xml");
                const wpts = xml.getElementsByTagName("wpt");
                for (let i = 0; i < wpts.length; i++) {
                    const lat = parseFloat(wpts[i].getAttribute("lat"));
                    const lon = parseFloat(wpts[i].getAttribute("lon"));
                    const name = wpts[i].getElementsByTagName("name")[0]?.textContent || "Waypoint";
                    gpxData.push({ lat, lon, name, type });
                    createMarker(lat, lon, name, type);
                }
            } catch (e) { console.warn("GPX Load Failed:", url); }
        }

        function createMarker(lat, lon, name, type, isSearch = false) {
            const shortName = name.split(',')[0].trim();
            if (mapType === 'gl') {
                const el = document.createElement('div');
                el.style.position = 'relative';
                el.innerHTML = `<div class="marker-label">${shortName}</div><svg width="24" height="24" viewBox="0 0 24 24" fill="black" stroke="white" stroke-width="1">${ICON_PATHS[type]}</svg>`;
                const m = new maplibregl.Marker({element: el}).setLngLat([lon, lat]).addTo(map);
                if(isSearch) searchMarker = m;
            } else {
                const icon = L.divIcon({
                    className: '',
                    html: `<div style="position:relative"><div class="marker-label">${shortName}</div><svg width="24" height="24" viewBox="0 0 24 24" fill="black" stroke="white" stroke-width="1">${ICON_PATHS[type]}</svg></div>`,
                    iconSize: [24, 24], iconAnchor: [12, 12]
                });
                const m = L.marker([lat, lon], { icon }).addTo(map);
                if(isSearch) searchMarker = m;
            }
        }

        async function searchLocation() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;
            const btn = document.getElementById('search-button');
            btn.innerText = "...";

            // 1. Check local GPX first
            const localMatch = gpxData.find(pt => pt.name.toLowerCase().includes(query.toLowerCase()));
            if (localMatch) {
                jumpTo(localMatch.lat, localMatch.lon);
                btn.innerText = "SEARCH";
                return;
            }

            // 2. Intent-aware Global Search
            try {
                const isExplicit = /[,]|UK|U\.K|United Kingdom|Australia|USA|U\.S|States|France|Germany|Japan/i.test(query);
                let lat, lon, name;
                if (!isExplicit) {
                    const c = map.getCenter();
                    const rev = await (await fetch(`https://api.stadiamaps.com/geocoding/v1/reverse?point.lat=${c.lat}&point.lon=${c.lng}&api_key=${STADIA_API_KEY}&size=1`)).json();
                    const code = rev.features?.[0]?.properties?.country_code || "";
                    const localRes = await (await fetch(`https://api.stadiamaps.com/geocoding/v1/search?text=${encodeURIComponent(query)}&boundary.country=${code}&api_key=${STADIA_API_KEY}&size=1`)).json();
                    if (localRes.features?.length > 0) {
                        [lon, lat] = localRes.features[0].geometry.coordinates;
                        name = localRes.features[0].properties.name;
                    }
                }
                if (!lat) {
                    const globalRes = await (await fetch(`https://api.stadiamaps.com/geocoding/v1/search?text=${encodeURIComponent(query)}&api_key=${STADIA_API_KEY}&size=1`)).json();
                    if (globalRes.features?.length > 0) {
                        [lon, lat] = globalRes.features[0].geometry.coordinates;
                        name = globalRes.features[0].properties.name;
                    }
                }
                if (lat) {
                    if(searchMarker) { if(mapType==='gl') searchMarker.remove(); else map.removeLayer(searchMarker); }
                    createMarker(lat, lon, name, 'search', true);
                    jumpTo(lat, lon);
                }
            } catch (e) { console.error(e); } finally { btn.innerText = "SEARCH"; }
        }

        function jumpTo(lat, lon) {
            lastPinCoords = {lat, lon};
            if (mapType === 'gl') map.jumpTo({ center: [lon, lat], zoom: 15 });
            else map.setView([lat, lon], 15);
        }

        function clearSearch() {
            document.getElementById('search-input').value = "";
            if(searchMarker) { if(mapType==='gl') searchMarker.remove(); else map.removeLayer(searchMarker); searchMarker = null; }
            lastPinCoords = null;
        }

        function resetView() { if(lastPinCoords) jumpTo(lastPinCoords.lat, lastPinCoords.lon); }
        function panMap(dx, dy) { map.panBy([dx * 100, dy * 100], { animate: false }); }
    </script>
</body>
</html>
