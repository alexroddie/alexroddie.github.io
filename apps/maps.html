<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <meta charset="UTF-8">
    <title>Maps (Standalone Full-Screen)</title>

    <!-- MapLibre GL JS (Vector map for Desktop) -->
    <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />

    <!-- Leaflet (Raster fallback for Kindle) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
        }

        /* 
         * FIX FOR GREY BAR: 
         * Force html and body to exactly 100% height, disable scrolling,
         * and explicitly set the background to white to hide any bleeding #e5e5e5. 
         */
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            background-color: #ffffff !important;
            overflow: hidden;
            font-family: "Geneva", "Verdana", sans-serif;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .title-bar { display: none; }

        .window {
            width: 100%;
            height: 100%;
            flex-grow: 1;
            border: none;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
        }

        #map {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            background: #ffffff;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            z-index: 1;
        }

        .leaflet-tile-container {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        /* UI PANELS */
        .overlay-panel {
            position: absolute;
            background: white;
            border: 2px solid black;
            padding: 10px;
            z-index: 500;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }

        .panel-top-left {
            top: 10px;
            left: 10px;
            width: 260px;
        }

        .home-btn {
            background: white;
            border: 2px solid black;
            font-weight: bold;
            padding: 2px 8px;
            cursor: pointer;
            margin-bottom: 8px;
            display: inline-block;
            text-decoration: none;
            color: black;
            font-size: 0.8rem;
            text-align: center;
        }

        .tab-row { display: flex; border-bottom: 2px solid black; margin-bottom: 10px; }
        .tab-btn { flex: 1; padding: 5px; cursor: pointer; background: #eee; border: none; font-weight: bold; margin: 0; }
        .tab-btn.active { background: black; color: white; }
        input[type="text"] { width: 100%; padding: 6px; border: 2px solid black; box-sizing: border-box; margin-bottom: 5px; font-family: inherit; }
        button.sys-btn { width: 100%; background: white; border: 2px solid black; font-weight: bold; padding: 5px; cursor: pointer; text-transform: uppercase; }
        
        .panel-bottom-right { 
            position: absolute; 
            bottom: 20px; 
            right: 20px; 
            z-index: 500; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }

        .panel-bottom-right > * + * {
            margin-top: 10px; /* Kindle-safe flex spacing */
        }

        .zoom-controls {
            display: flex;
            flex-direction: column;
            background: white;
            border: 2px solid black;
            padding: 4px;
            box-shadow: 4px 4px 0 black;
        }

        .zoom-controls > * + * {
            margin-top: 4px; /* Kindle-safe flex spacing */
        }

        .zoom-btn { width: 35px; height: 35px; background: white; border: 2px solid black; font-weight: 900; font-size: 1.2rem; cursor: pointer; }

        /* RESTORED D-PAD (Using Grid, so gap is legal per guidelines) */
        .d-pad {
            display: grid;
            grid-template-columns: 35px 35px 35px;
            grid-template-rows: 35px 35px 35px;
            gap: 4px;
            background: white;
            border: 2px solid black;
            padding: 4px;
            box-shadow: 4px 4px 0 black;
        }

        .d-btn {
            width: 100%;
            height: 100%;
            background: white;
            border: 2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.2rem;
            margin: 0;
            padding: 0;
        }

        .d-btn.center {
            font-size: 0.7rem;
            background: #eee;
        }

    </style>

    <script src="js/i18n.js"></script>
    <script src="theme.js"></script>
</head>

<body>

    <div class="window">
        <!-- Top Left Search Panel -->
        <div class="overlay-panel panel-top-left">
            <a href="https://alexroddie.github.io/" class="home-btn">← BACK TO BOOKMARKS</a>
            
            <div class="tab-row">
                <button class="tab-btn active" id="tab-find" onclick="setMode('find')">Find</button>
                <button class="tab-btn" id="tab-route" onclick="setMode('route')">Route</button>
            </div>

            <div id="mode-find-content">
                <input type="text" id="search-input" placeholder="Search location..." onkeypress="if(event.key==='Enter') searchLocation()">
                <button class="sys-btn" onclick="searchLocation()">Search</button>
            </div>

            <div id="mode-route-content" style="display:none;">
                <input type="text" id="route-start" placeholder="Start (empty for center)">
                <input type="text" id="route-end" placeholder="Destination">
                <button class="sys-btn" onclick="calcRoute()">Get Route</button>
            </div>
        </div>

        <!-- Bottom Right Navigation Panel (Restored) -->
        <div class="panel-bottom-right">
            <div class="zoom-controls">
                <button class="zoom-btn" onclick="map.zoomIn()">+</button>
                <button class="zoom-btn" onclick="map.zoomOut()">-</button>
            </div>

            <div class="d-pad">
                <div></div>
                <button class="d-btn" onclick="panMap(0, -1)">▲</button>
                <div></div>

                <button class="d-btn" onclick="panMap(-1, 0)">◀</button>
                <button class="d-btn center" onclick="resetView()">●</button>
                <button class="d-btn" onclick="panMap(1, 0)">▶</button>

                <div></div>
                <button class="d-btn" onclick="panMap(0, 1)">▼</button>
                <div></div>
            </div>
        </div>

        <div id="map"></div>
    </div>

    <script>
        async function fetchWithProxyFallback(targetUrl, options = {}) {
            try {
                const res = await fetch(targetUrl, {
                    ...options,
                    headers: { 'Accept-Language': 'en' }
                });
                if (!res.ok) throw new Error(`API error: ${res.status}`);
                return res;
            } catch (e) {
                console.error("Direct fetch failed:", e);
                throw e;
            }
        }

        let map;
        let mapType = 'gl';
        const defaultCenterLat = 51.5072;
        const defaultCenterLon = -0.1276;

        window.onload = () => {
            initMap();
        };

        async function initMap() {
            if (typeof maplibregl !== 'undefined' && maplibregl.supported && maplibregl.supported()) {
                mapType = 'gl';
                map = new maplibregl.Map({
                    container: 'map',
                    style: 'https://openmaptiles.geo.data.gouv.fr/styles/maptiler-toner/style.json',
                    center: [defaultCenterLon, defaultCenterLat], 
                    zoom: 13,
                    attributionControl: false,
                    fadeDuration: 0 
                });
            } else {
                mapType = 'leaflet';
                initLeafletMap();
            }
        }

        function initLeafletMap() {
            map = L.map('map', {
                zoomControl: false,
                attributionControl: false,
                zoomAnimation: false, 
                fadeAnimation: false,
                markerZoomAnimation: false
            }).setView([defaultCenterLat, defaultCenterLon], 13);

            L.tileLayer('https://tiles.stadiamaps.com/tiles/stamen_toner/{z}/{x}/{y}{r}.png?api_key=d03c70b5-65ef-4dcf-ae08-a5bfa5c52010', {
                minZoom: 0,
                maxZoom: 20,
                attribution: '&copy; Stadia/Stamen'
            }).addTo(map);
        }

        function setMode(mode) {
            document.getElementById('mode-find-content').style.display = mode === 'find' ? 'block' : 'none';
            document.getElementById('mode-route-content').style.display = mode === 'route' ? 'block' : 'none';
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.id === `tab-${mode}`));
        }

        async function searchLocation() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;
            try {
                const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`;
                const res = await fetchWithProxyFallback(url);
                const data = await res.json();
                if (data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    if (mapType === 'gl') map.jumpTo({ center: [lon, lat], zoom: 15 });
                    else map.setView([lat, lon], 15);
                } else {
                    alert("Location not found.");
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function calcRoute() {
            const end = document.getElementById('route-end').value.trim();
            if (!end) return;
            try {
                const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(end)}&limit=1`;
                const res = await fetchWithProxyFallback(url);
                const data = await res.json();
                if (data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    if (mapType === 'gl') map.jumpTo({ center: [lon, lat], zoom: 15 });
                    else map.setView([lat, lon], 15);
                }
            } catch (e) { console.error(e); }
        }

        // --- RESTORED NAVIGATION LOGIC ---
        function panMap(dx, dy) {
            // map.panBy takes pixel coordinates. 100px increments are safe for E-ink.
            map.panBy([dx * 100, dy * 100], { duration: 0, animate: false });
        }

        function resetView() {
            if (mapType === 'leaflet') {
                map.setView([defaultCenterLat, defaultCenterLon], 13);
            } else {
                map.jumpTo({ center: [defaultCenterLon, defaultCenterLat], zoom: 13 });
            }
        }
    </script>
</body>
</html>
