name: Update Mountain Weather Dashboard

on:
  schedule:
    - cron: '0 6,18 * * *' # Runs at 06:00 and 18:00 UTC daily
  workflow_dispatch: # Allows you to trigger it manually

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the bot to push the new HTML file

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run scraper and build HTML
        run: |
          cd mountainweather
          python build.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add mountainweather/index.html
          git commit -m "Auto-update forecast dashboard" || exit 0
          git push
