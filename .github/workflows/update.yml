name: Update Mountain Weather Dashboard

on:
  schedule:
    - cron: '0 6,18 * * *' # Runs at 06:00 and 18:00 UTC daily
  workflow_dispatch: # Allows you to trigger it manually

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Updated to fix Node 20 warning

      - name: Set up Python
        uses: actions/setup-python@v5 # Updated to fix Node 20 warning
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run scraper and build HTML
        # IMPORTANT: Change "mountainweather" below if your folder has capital letters!
        working-directory: ./mountainweather 
        run: python build.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add .
          git commit -m "Auto-update forecast dashboard" || echo "No changes to commit"
          git push
