name: Update Mountain Weather Dashboard

on:
  schedule:
    - cron: '0 6,18 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Locate and Run Scraper
        run: |
          # Finds any Python file in your repository and runs it safely
          SCRIPT_PATH=$(find . -iname "*.py" | head -n 1)
          cd "$(dirname "$SCRIPT_PATH")"
          python "$(basename "$SCRIPT_PATH")"

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add -A
          
          # The --allow-empty flag forces Git to succeed even if the weather hasn't changed!
          git commit --allow-empty -m "Auto-update forecast dashboard"
          git push
