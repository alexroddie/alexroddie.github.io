name: Mountain Dashboard Update

on:
  schedule:
    # Expanded "Shotgun" schedule to combat GitHub latency and BST/GMT shifts.
    # Fires at 15 past the hour for:
    # - 05:15 & 06:15 UTC (Morning check)
    # - 14:15 UTC (Early afternoon/Pre-MWIS buffer)
    # - 15:15, 16:15, 17:15, & 18:15 UTC (Primary evening update window)
    - cron: '15 5,6,14,15,16,17,18 * * *'
  workflow_dispatch: 

# Prevents "traffic jams": If a delayed run is still active when a new one 
# is triggered, GitHub will cancel the older run and start the fresh one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Using a Personal Access Token ensures GitHub treats these updates 
          # as "human activity," preventing the 60-day automatic pause.
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }} 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 tzdata

      - name: Run Scraper
        run: |
          cd mountainweather
          python build.py

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add -A
          
          # Allow empty commits to ensure the activity timestamp always updates.
          git commit --allow-empty -m "Auto-update forecast dashboard"
          
          # Rebase handles cases where the repo might have changed during the run.
          git pull origin main --rebase
          git push origin main
