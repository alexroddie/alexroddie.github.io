name: Update Mountain Weather Dashboard

on:
  schedule:
    - cron: '0 6,18 * * *' # Runs at 06:00 and 18:00 UTC daily
  workflow_dispatch: # Allows you to trigger it manually

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Scraper
        run: |
          # Automatically find any Python file, navigate to its folder, and run it
          SCRIPT_PATH=$(find . -iname "*.py" | head -n 1)
          cd "$(dirname "$SCRIPT_PATH")"
          python "$(basename "$SCRIPT_PATH")"

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add -A
          
          # If the weather hasn't changed, this command safely exits with success instead of crashing
          git commit -m "Auto-update forecast dashboard" || exit 0
          
          git push
