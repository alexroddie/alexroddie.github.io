name: Update Mountain Weather Dashboard

on:
  schedule:
   - cron: '30 4,11,16,17 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        # Added tzdata to ensure the Europe/London timezone works
        run: pip install requests beautifulsoup4 tzdata

      - name: Run Scraper
        # Explicitly move into your folder and run the script
        run: |
          cd mountainweather
          python build.py

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add -A
          
          git commit --allow-empty -m "Auto-update forecast dashboard"
          
          git pull origin main --rebase
          git push origin main
