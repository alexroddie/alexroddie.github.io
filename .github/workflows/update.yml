name: Update Mountain Weather Dashboard

on:
  schedule:
    # Runs at 04:30, 10:30, 16:30, and 17:30 UTC (GMT) every day
    - cron: '30 4,10,16,17 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # CRITICAL: This forces Git to push using your human credentials. 
          # GitHub sees this as daily human activity. The 60-day rule will never trigger.
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }} 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 tzdata

      - name: Run Scraper
        run: |
          cd mountainweather
          python build.py

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add -A
          
          git commit --allow-empty -m "Auto-update forecast dashboard"
          
          git pull origin main --rebase
          git push origin main
