name: Update Mountain Weather Dashboard

on:
  schedule:
    # Runs at 04:30, 11:30, 16:30, and 17:30 UTC (GMT) every day
    - cron: '30 4,11,16,17 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 tzdata

      - name: Run Scraper
        run: |
          cd mountainweather
          python build.py

      - name: Commit and Push
        run: |
          # The bot handles the commits so your contribution graph stays clean
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add -A
          
          git commit --allow-empty -m "Auto-update forecast dashboard"
          
          git pull origin main --rebase
          git push origin main

      - name: Prevent 60-Day Suspension
        env:
          # CRITICAL: This hits the API using your human PAT, resetting the 60-day clock
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: gh workflow enable update.yml
