name: Update Mountain Weather Dashboard

on:
  schedule:
    # Runs at 05:00, 17:00, and 18:00 UTC (GMT) every day
    - cron: '0 5,17,18 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # CRITICAL: Downloads full history so Git can rebase properly

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Locate and Run Scraper
        run: |
          SCRIPT_PATH=$(find . -iname "*.py" | head -n 1)
          cd "$(dirname "$SCRIPT_PATH")"
          python "$(basename "$SCRIPT_PATH")"

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add -A
          
          git commit --allow-empty -m "Auto-update forecast dashboard"
          
          # Explicitly target the main branch for the pull and push
          git pull origin main --rebase
          git push origin main
